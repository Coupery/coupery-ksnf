[package]
name = "coupery-ksnf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Key-Stable Nested FROST for secp256k1 and Ed25519"
homepage = "https://coupery.com"
repository = "https://github.com/Coupery/coupery-ksnf"
authors = ["Jud Stephenson <jud@coupery.com>"]
keywords = ["cryptography", "ed25519", "frost", "taproot", "threshold"]
categories = ["cryptography"]
exclude = [
    ".github",
    ".gitignore",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "public-api",
    "rust-toolchain.toml",
    "rustfmt.toml",
]

[features]
default = ["secp256k1"]
ed25519 = ["dep:frost-ed25519"]
secp256k1 = ["dep:frost-secp256k1", "dep:k256"]
taproot = ["secp256k1"]

[dependencies]
frost-core = { version = "3.0.0", default-features = false }
frost-ed25519 = { version = "3.0.0", default-features = false, optional = true }
frost-secp256k1 = { version = "3.0.0", default-features = false, optional = true }
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic", "hash2curve"], optional = true }
rand_core = { version = "0.6.4", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
k256 = { version = "0.13.4", default-features = false, features = ["schnorr"] }
rand_chacha = "0.3.1"
serde_json = "1.0.145"

[[example]]
name = "nested_signing"
required-features = ["secp256k1"]

[[example]]
name = "reshare_during_signing"
required-features = ["secp256k1"]

[[example]]
name = "ed25519_webauthn"
required-features = ["ed25519"]

[[example]]
name = "taproot_keypath"
required-features = ["taproot"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
