[package]
name = "coupery-ksnf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Reference implementation of Key-Stable Nested FROST"
homepage = "https://coupery.com"
authors = ["Jud Stephenson <jud@coupery.com>"]
keywords = ["cryptography", "frost", "schnorr", "threshold"]
categories = ["cryptography"]
exclude = [".gitignore", "AGENTS.md", "rust-toolchain.toml", "rustfmt.toml"]

[dependencies]
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic", "hash2curve"] }
rand_core = { version = "0.6.4", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
rand_chacha = "0.3.1"
serde_json = "1.0.145"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
